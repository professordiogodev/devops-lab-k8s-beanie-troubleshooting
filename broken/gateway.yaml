apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: beanie-broken
  labels: {app: gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: __IMAGE__
          args: ["gateway"]
          ports:
            - containerPort: 8000
          env:
            - {name: MENU_URL, value: "http://menu:8001"}
            - {name: ORDERS_URL, value: "http://orders:8002"}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: beanie-broken
spec:
  selector: {app: gateway}
  ports:
    - port: 8000
      targetPort: 8000
