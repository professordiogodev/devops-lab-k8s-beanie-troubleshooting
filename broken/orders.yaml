apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: beanie-broken
  labels: {app: orders}
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels: {app: orders}
    spec:
      containers:
        - name: orders
          image: __IMAGE__
          args: ["ordres"]
          ports:
            - containerPort: 8002
          env:
            - {name: MENU_URL, value: "http://menu:8001"}
            - {name: PAYMENTS_URL, value: "http://payments:8003"}
            - {name: NOTIFICATIONS_URL, value: "http://notifications:8004"}
          livenessProbe:
            httpGet: {path: /healthz, port: 8002}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: 8002}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: beanie-broken
spec:
  selector: {app: orders}
  ports:
    - port: 8002
      targetPort: 8002
